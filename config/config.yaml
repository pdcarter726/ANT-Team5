# ANT Neuro eego hackathon project - main config.
# Everything marked PLACEHOLDER must be checked against the real amplifier.
# collect.py / synthetic_eeg.py print the stream's real channel info on startup.

eeg_stream:
  type: EEG            # LSL stream type to resolve
  name: null           # set to the exact stream name if several EEG streams exist
  resolve_timeout_s: 12
  units_to_uv: 1.0     # multiply raw samples by this to get microvolts (check once real data is seen)

# CURRENT headset (second cap, named by the wearer): 24 channels, 500 Hz. The live LSL stream has 25 channels with
# NO labels and the 25th is all zeros: the first 24 get these names, the extra one is ignored.
# (The first cap, Session1/2 .cnt files, had M1 t7 c3 c4 t8 M2 cz p7 ... oz o1 o2; see model.aliases below.)
# Names are matched case-insensitively.
sampling_rate: 500
channels: [Fp1, FP2, F9, F7, F3, Fz, F4, F8, F10, T9, T7, C3, C4, T8, T10, P9, P7, P3, Pz, P4, P8, P10, O1, O2]

# Channels the trained model uses (the ones both caps have). Everything else (cz, oz, P9, P10, the zero channel) is
# dropped before preprocessing. aliases: names of the older cap -> canonical name. ASSUMPTION: the old mastoids M1/M2
# are treated as T9/T10 (both sit near the ears); calibration absorbs the remaining difference.
model:
  channels: [Fp1, Fp2, F9, F7, F3, Fz, F4, F8, F10, T9, T7, C3, C4, T8, T10, P7, P3, Pz, P4, P8, O1, O2]
  aliases: {M1: T9, M2: T10}

# Channel groups for features and the signal-check view (edit freely; unknown names are ignored).
channel_groups:
  frontal:   [Fp1, Fp2, F7, F3, Fz, F4, F8]
  eyeside:   [F9, F10]
  temporal:  [T7, T8, F7, F8, P7, P8]
  mastoid:   [T9, T10]
  central:   [C3, C4]
  parietal:  [P7, P3, Pz, P4, P8]
  occipital: [O1, O2]
  # left and right MUST be in matching order (Fp1<->Fp2, F9<->F10, ...): asymmetry features pair them by position.
  left:      [Fp1, F9, F7, F3, T9, T7, C3, P7, P3, O1]
  right:     [Fp2, F10, F8, F4, T10, T8, C4, P8, P4, O2]

markers:
  name: CueMarkers
  type: Markers

signal_check:
  display_channels: [Fp1, FP2, F9, F10, T7, T8, C3, O1]
  window_s: 6
  uv_per_row: 100        # trace scale: +/- this many uV fills half a row (changeable with +/-)
  flat_rms_uv: 0.3       # RMS below this = FLAT (bad contact / disconnected)
  saturated_uv: 2000     # |x - median| above this = SATURATED
  noisy_rms_uv: 150      # 2 s RMS above this = NOISY
  line_hz: 60

# Class catalogue. Keys are the labels written to markers/CSV.
# cue_s on a class overrides the session cue_s (used for long confounder trials).
classes:
  rest:           {display: "STAY RELAXED",    hint: "Do nothing. Eyes open, face relaxed."}
  left_wink:      {display: "LEFT WINK",       hint: "Wink the LEFT eye once, then relax."}
  right_wink:     {display: "RIGHT WINK",      hint: "Wink the RIGHT eye once, then relax."}
  double_blink:   {display: "DOUBLE BLINK",    hint: "Two quick deliberate blinks."}
  jaw_clench:     {display: "CLENCH JAW",      hint: "Clench teeth and HOLD until the cue ends."}
  eyebrow_raise:  {display: "RAISE EYEBROWS",  hint: "Raise both eyebrows, hold, relax."}
  head_left:      {display: "TURN HEAD LEFT",  hint: "Turn left, hold ~1 s. Return to center during rest."}
  head_right:     {display: "TURN HEAD RIGHT", hint: "Turn right, hold ~1 s. Return to center during rest."}
  head_up:        {display: "TILT HEAD UP",    hint: "Tilt up, hold ~1 s. Return to center during rest."}
  head_down:      {display: "TILT HEAD DOWN",  hint: "Tilt down, hold ~1 s. Return to center during rest."}
  look_left:      {display: "LOOK LEFT",       hint: "Eyes only, head still. Hold, return during rest."}
  look_right:     {display: "LOOK RIGHT",      hint: "Eyes only, head still. Hold, return during rest."}
  look_up:        {display: "LOOK UP",         hint: "Eyes only, head still. Hold, return during rest."}
  look_down:      {display: "LOOK DOWN",       hint: "Eyes only, head still. Hold, return during rest."}
  # Confounders (session 2): measure false triggers. Do them naturally.
  talking:          {display: "TALK",            hint: "Talk out loud about anything.", cue_s: 6.0}
  chewing:          {display: "CHEW",            hint: "Chew gum / pretend to chew.",   cue_s: 6.0}
  natural_blinking: {display: "BLINK NATURALLY", hint: "Look at the screen, blink as usual.", cue_s: 6.0}
  typing:           {display: "TYPE",            hint: "Type on the keyboard (any text).", cue_s: 6.0}
  idle:             {display: "IDLE",            hint: "Look at the screen, move naturally.", cue_s: 6.0}

sessions:
  1:
    classes: [rest, left_wink, right_wink, double_blink, jaw_clench, eyebrow_raise,
              head_left, head_right, head_up, head_down,
              look_left, look_right, look_up, look_down]
    confounders: []
    trials_per_class: 25
    confounder_trials_per_class: 0
    cue_s: 1.5
    rest_s: 2.5
    start_countdown_s: 5
    break_every_blocks: 5     # a block = every class once, shuffled
    break_min_s: 15           # minimum break length (also used in the duration estimate)
    max_minutes_warn: 26
  2:
    # From the session-1 feasibility analysis (head_left added by hand: borderline, kept for symmetry with head_right;
    # look_* dropped: confused with head_*).
    keep: [rest, double_blink, eyebrow_raise, head_down, head_left, head_right, head_up, jaw_clench, left_wink, right_wink]
    confounders: [talking, chewing, natural_blinking, typing, idle]
    trials_per_class: 30     # 50 does not fit 30 min with 10 classes (41 min)
    confounder_trials_per_class: 10
    cue_s: 1.5
    rest_s: 2.5
    start_countdown_s: 5
    break_every_blocks: 10
    break_min_s: 15
    max_minutes_warn: 30
  3:
    # ~2 minute per-user calibration (calibrate.py). Same gestures as the profile, 3 trials each, plus short confounders.
    keep: [rest, double_blink, eyebrow_raise, head_down, head_left, head_right, head_up, jaw_clench, left_wink, right_wink]
    confounders: [natural_blinking, talking]
    trials_per_class: 3
    confounder_trials_per_class: 1
    cue_s: 1.5
    rest_s: 2.0
    start_countdown_s: 5
    break_every_blocks: 0
    max_minutes_warn: 3
  4:
    # ~5 minute calibration used by "python modeltest": 6 trials per gesture + 2 of each confounder.
    keep: [rest, double_blink, eyebrow_raise, head_down, head_left, head_right, head_up, jaw_clench, left_wink, right_wink]
    confounders: [natural_blinking, talking, typing, chewing, idle]
    trials_per_class: 6
    confounder_trials_per_class: 2
    cue_s: 1.5
    rest_s: 2.0
    start_countdown_s: 5
    break_every_blocks: 0
    max_minutes_warn: 6
  5:
    # ~10 minute per-session calibration run from the controller dashboard ("Start session").
    # Same gestures as the profile + every confounder; enough trials to train a profile from scratch if needed.
    keep: [rest, double_blink, eyebrow_raise, head_down, head_left, head_right, head_up, jaw_clench, left_wink, right_wink]
    confounders: [natural_blinking, talking, typing, chewing, idle]
    trials_per_class: 14
    confounder_trials_per_class: 3
    cue_s: 1.5
    rest_s: 2.0
    start_countdown_s: 5
    break_every_blocks: 0
    max_minutes_warn: 11
  7:
    # Targeted recalibration of chosen gestures (--classes / the dashboard's "Recalibrate gestures"): `keep` is replaced
    # by the chosen gestures + rest at run time. 8 trials each plus a few confounders; 3 gestures take about 2.5 min.
    keep: [rest, jaw_clench]
    confounders: [natural_blinking, talking]
    trials_per_class: 8
    confounder_trials_per_class: 2
    cue_s: 1.5
    rest_s: 2.0
    start_countdown_s: 5
    break_every_blocks: 0
    max_minutes_warn: 6
  6:
    # ~1 minute quick calibration ("python modeltest --quick"): 2 trials per gesture, no confounders, rest comes from the gaps.
    keep: [double_blink, eyebrow_raise, head_down, head_left, head_right, head_up, jaw_clench, left_wink, right_wink]
    confounders: []
    trials_per_class: 2
    confounder_trials_per_class: 0
    cue_s: 1.5
    rest_s: 1.5
    start_countdown_s: 4
    break_every_blocks: 0
    max_minutes_warn: 1.2
