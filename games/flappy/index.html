<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird - Hands-free Arcade</title>
  <link rel="stylesheet" href="../shared/hf.css">
  <style>
    canvas { display: block; width: 100%; height: 100%; }
    .panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 2vh; text-align: center;
      padding: 4vh 4vw; border-radius: 24px; background: rgba(11, 13, 18, .88); border: 2px solid var(--line);
    }
    .panel.open { display: flex; }
    .panel h2 { margin: 0; font-size: clamp(30px, 7vh, 72px); }
    .panel p { margin: 0; color: var(--muted); font-size: clamp(15px, 2.4vh, 24px); max-width: 46vw; }
    .panel .go { width: min(40vw, 520px); height: 22vh; border-radius: 22px; font-size: clamp(26px, 5vh, 52px); font-weight: 800;
      background: var(--panel); border: 2px solid var(--accent); overflow: hidden; }
  </style>
</head>
<body>
<div class="hf-page">
  <canvas id="c"></canvas>
  <div class="panel open" id="panel">
    <h2 id="panel-title">Flappy Bird</h2>
    <p id="panel-text"></p>
    <button class="go" id="go" data-dwell="ui">Start</button>
  </div>
</div>

<script src="../shared/hf.js"></script>
<script>
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const page = document.querySelector(".hf-page");
  const bar = HF.topbar({ title: "FLAPPY BIRD", onMenu: () => pause() });
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = page.clientWidth; H = page.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // Sizes are fractions of the screen height so the game feels the same on any display.
  const DIFF = {
    easy:   { gap: 0.36, speed: 0.22, spacing: 0.75 },
    normal: { gap: 0.30, speed: 0.28, spacing: 0.65 },
    hard:   { gap: 0.25, speed: 0.34, spacing: 0.58 },
  };
  let level = localStorage.getItem("flappy.level") || "easy";
  const G = 2.1, FLAP = -0.62, MAX_FALL = 1.0;   // in screen heights per second (squared)

  const s = { phase: "ready", y: 0.5, vy: 0, pipes: [], score: 0, t: 0, nextPipe: 0, wing: 0 };

  function reset() {
    Object.assign(s, { phase: "ready", y: 0.5, vy: 0, pipes: [], score: 0, t: 0, nextPipe: 0.6 });
  }

  function start() {
    reset();
    s.phase = "play";
    panel(false);
    flap();
  }

  function flap() {
    if (s.phase === "ready" || s.phase === "over") return;
    if (s.phase !== "play") return;
    s.vy = FLAP;
    s.wing = 1;
    HF.tone(700, 60, "triangle", 0.08);
  }

  function pause() {
    if (s.phase !== "play") return;
    s.phase = "paused";
    HF.openMenu({ title: "Paused", sub: "Eyebrow raise or Esc to resume", items: [
      { label: "Resume", fn: resume },
      { label: "Restart", fn: start },
      { label: `Difficulty: ${level} (change)`, fn: () => { level = { easy: "normal", normal: "hard", hard: "easy" }[level]; localStorage.setItem("flappy.level", level); start(); } },
      { label: "Main arcade", fn: HF.goArcade },
    ], onClose: resume });
  }
  function resume() { if (s.phase === "paused") { s.phase = "play"; last = performance.now(); } }

  function die() {
    s.phase = "over";
    HF.sfx.bad();
    const newBest = HF.recordBest("flappy", s.score);
    setTimeout(() => panel(true, "Game over", `Score ${s.score}${newBest ? " - new best!" : ` · best ${HF.best("flappy")}`}`, "Play again"), 500);
  }

  function controlsText() {
    return HF.eyesOnly()
      ? "Eyes only: the bird flies toward where you look. Look at the gaps between the pipes."
      : "Clench your jaw or raise your eyebrows to flap. Double blink = pause.";
  }
  function panel(open, title = "Flappy Bird", text = controlsText(), btn = "Start") {
    document.getElementById("panel").classList.toggle("open", open);
    document.getElementById("panel-title").textContent = title;
    document.getElementById("panel-text").textContent = text + (title !== "Flappy Bird" ? "" : ` (difficulty: ${level})`);
    document.getElementById("go").textContent = btn;
  }
  document.getElementById("go").addEventListener("click", start);

  HF.on((name) => {
    if (name === "press" || name === "eyebrow_raise") {
      if (s.phase === "play") flap();
    } else if (name === "double_blink" || name === "escape") {
      pause();
    } else if (name === "inputchange") {
      if (s.phase !== "play") panel(true, document.getElementById("panel-title").textContent, controlsText(),
        document.getElementById("go").textContent);
    }
  });

  // ---------------------------------------------------------------- simulation (units: screen heights)
  const BIRD_X = 0.28, R = 0.032, PIPE_W = 0.12;

  function step(dt) {
    const d = DIFF[level];
    const aspect = W / H;
    if (HF.eyesOnly()) {
      // steer: chase the gaze height with a capped speed, so gaze jitter can't teleport the bird
      const target = Math.min(0.97, Math.max(0.03, HF.mouse.y / H));
      const want = (target - s.y) * 4;
      s.vy += (Math.max(-0.9, Math.min(0.9, want)) - s.vy) * Math.min(1, dt * 8);
    } else {
      s.vy = Math.min(MAX_FALL, s.vy + G * dt);
    }
    s.y += s.vy * dt;
    s.wing = Math.max(0, s.wing - dt * 4);

    s.nextPipe -= dt * d.speed;
    if (s.nextPipe <= 0) {
      const margin = 0.08 + d.gap / 2;
      s.pipes.push({ x: aspect + PIPE_W, gapY: margin + Math.random() * (1 - 2 * margin), passed: false });
      s.nextPipe = d.spacing;
    }
    for (const p of s.pipes) {
      p.x -= d.speed * dt;
      if (!p.passed && p.x + PIPE_W < BIRD_X * aspect) {
        p.passed = true;
        s.score++;
        HF.tone(880, 80, "triangle", 0.1);
      }
    }
    s.pipes = s.pipes.filter((p) => p.x > -PIPE_W);

    if (s.y - R < 0) { s.y = R; s.vy = Math.max(0, s.vy); }   // the sky is a ceiling, not a death (extra detections happen)
    if (s.y + R > 1) return die();
    const bx = BIRD_X * aspect;
    for (const p of s.pipes) {
      const inX = bx + R > p.x && bx - R < p.x + PIPE_W;
      const inGap = s.y - R > p.gapY - d.gap / 2 && s.y + R < p.gapY + d.gap / 2;
      if (inX && !inGap) return die();
    }
  }

  function draw() {
    const d = DIFF[level];
    const u = H;   // 1 unit = screen height in px
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1b2f4f"); sky.addColorStop(1, "#3c6e8f");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (const p of s.pipes) {
      const x = p.x * u, w = PIPE_W * u, top = (p.gapY - d.gap / 2) * u, bot = (p.gapY + d.gap / 2) * u;
      ctx.fillStyle = "#2fa84f";
      ctx.fillRect(x, 0, w, top);
      ctx.fillRect(x, bot, w, H - bot);
      ctx.fillStyle = "#3fd068";
      ctx.fillRect(x - 6, top - 26, w + 12, 26);
      ctx.fillRect(x - 6, bot, w + 12, 26);
    }

    const bx = BIRD_X * W, by = s.y * u, r = R * u;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(Math.max(-0.5, Math.min(1.0, s.vy * 1.2)));
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.ellipse(-r * 0.3, r * 0.1 - s.wing * r * 0.5, r * 0.55, r * 0.32, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.3, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fb7185";
    ctx.beginPath(); ctx.moveTo(r * 0.8, 0); ctx.lineTo(r * 1.4, r * 0.15); ctx.lineTo(r * 0.8, r * 0.35); ctx.fill();
    ctx.restore();

    if (HF.eyesOnly() && s.phase === "play" && HF.mouse.known) {
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.setLineDash([8, 10]);
      ctx.beginPath(); ctx.moveTo(bx + r * 2, HF.mouse.y); ctx.lineTo(W, HF.mouse.y); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#fff";
    ctx.font = `800 ${Math.round(H * 0.1)}px system-ui`;
    ctx.textAlign = "center";
    ctx.fillText(String(s.score), W / 2, H * 0.14);
    bar.status(`Best ${HF.best("flappy")} · ${level}`);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (s.phase === "play") step(dt);
    else if (s.phase === "ready") s.y = 0.5 + Math.sin(now / 300) * 0.02;
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  panel(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
